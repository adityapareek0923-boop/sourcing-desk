<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track your RFQ — ChipShark</title>
<meta name="description" content="Track the status of your component sourcing request.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='0' y='9' width='4' height='2.5' rx='0.5' fill='%231d1d1f'/%3E%3Crect x='0' y='15' width='4' height='2.5' rx='0.5' fill='%231d1d1f'/%3E%3Crect x='0' y='21' width='4' height='2.5' rx='0.5' fill='%231d1d1f'/%3E%3Crect x='28' y='9' width='4' height='2.5' rx='0.5' fill='%231d1d1f'/%3E%3Crect x='28' y='15' width='4' height='2.5' rx='0.5' fill='%231d1d1f'/%3E%3Crect x='28' y='21' width='4' height='2.5' rx='0.5' fill='%231d1d1f'/%3E%3Crect x='4' y='5' width='24' height='22' rx='4' fill='%231d1d1f'/%3E%3Ccircle cx='9' cy='10' r='2' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f5f5f7;
    --ink: #1d1d1f;
    --ink-2: #424245;
    --ink-3: #86868b;
    --line: #d2d2d7;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-ink: #ffffff;
    --ok: #30861a;
    --warn: #8a4a0b;
    --err: #c21818;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 22px; }
  nav {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: saturate(180%) blur(20px);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 0.5px solid var(--line);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 48px; font-size: 14px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  .brand-mark { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
  .brand-mark svg { width: 26px; height: 26px; display: block; }
  .links a { color: var(--ink-2); text-decoration: none; margin-left: 20px; font-size: 13px; }
  .links a:hover { color: var(--ink); }

  main { padding: 80px 0 56px; }
  h1 { font-size: clamp(36px, 5vw, 56px); letter-spacing: -0.035em; font-weight: 600; margin: 0 0 10px; line-height: 1.07; }
  .lede { color: var(--ink-3); font-size: 17px; margin: 0 0 44px; letter-spacing: -0.012em; }

  .card { background: var(--surface-2); border-radius: 22px; padding: 36px; margin-bottom: 20px; }

  /* ID input (when no ?id= in URL) */
  .id-form label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .id-form input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: var(--bg); color: var(--ink);
    border: 0.5px solid var(--line); border-radius: 10px;
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.3px;
  }
  .id-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 980px; font-size: 17px; font-weight: 400; text-decoration: none; border: none; cursor: pointer; letter-spacing: -0.022em; transition: background-color .18s ease; }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Status display */
  .pill-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
  .short-id {
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 20px; font-weight: 600;
    background: var(--surface-2); padding: 6px 12px; border-radius: 8px;
    letter-spacing: 0.5px;
  }
  .status-pill {
    font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 980px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-pill.new { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .status-pill.new .dot { background: var(--accent); }
  .status-pill.quoting { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .status-pill.quoting .dot { background: var(--warn); animation: pulse 1.5s infinite; }
  .status-pill.quoted { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .status-pill.quoted .dot { background: var(--ok); }
  .status-pill.won { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .status-pill.won .dot { background: var(--ok); }
  .status-pill.lost { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
  .status-pill.lost .dot { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* Timeline */
  .timeline { position: relative; padding: 8px 0; margin: 20px 0; }
  .step { display: grid; grid-template-columns: 20px 1fr; gap: 14px; padding: 12px 0; align-items: start; }
  .step .mark {
    width: 14px; height: 14px; border-radius: 50%; margin-top: 4px;
    background: var(--surface-2); border: 2px solid var(--line);
    position: relative; z-index: 1;
  }
  .step.done .mark { background: var(--accent); border-color: var(--accent); }
  .step.active .mark { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  .step .label { font-size: 14px; font-weight: 500; }
  .step .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .step.pending .label { color: var(--ink-3); font-weight: 400; }
  .step .line {
    position: absolute; left: 6px; top: 20px; bottom: 20px; width: 2px;
    background: var(--line); z-index: 0;
  }

  /* Details grid */
  .details { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  @media (max-width: 480px) { .details { grid-template-columns: 1fr; } }
  .details .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-3); margin-bottom: 4px; }
  .details .v { font-size: 15px; color: var(--ink); font-weight: 500; }
  .details .v.mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }

  /* Quote card */
  .quote-card { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 14px; padding: 24px; margin-top: 20px; }
  .quote-card .amount { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; margin: 8px 0; }
  .quote-card .label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Error state */
  .error { color: var(--err); font-size: 14px; padding: 12px 16px; background: color-mix(in srgb, var(--err) 8%, transparent); border-radius: 10px; margin-top: 16px; }

  /* Help */
  .help { margin-top: 32px; text-align: center; color: var(--ink-3); font-size: 14px; }
  .help a { color: var(--accent); text-decoration: none; }

  .skeleton { background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.5s linear infinite; border-radius: 8px; height: 20px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="/" class="brand"><span class="brand-mark"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="0" y="9" width="4" height="2.5" rx="0.5"/><rect x="0" y="15" width="4" height="2.5" rx="0.5"/><rect x="0" y="21" width="4" height="2.5" rx="0.5"/><rect x="28" y="9" width="4" height="2.5" rx="0.5"/><rect x="28" y="15" width="4" height="2.5" rx="0.5"/><rect x="28" y="21" width="4" height="2.5" rx="0.5"/><rect x="4" y="5" width="24" height="22" rx="4"/><circle cx="9" cy="10" r="2" fill="#fff"/></svg></span>ChipShark</a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/#rfq">New RFQ</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <h1>Track your RFQ</h1>
  <p class="lede" id="lede">Enter your RFQ ID or follow the link from your confirmation email.</p>

  <div class="card" id="root">
    <!-- content injected by JS -->
    <div class="skeleton" style="width: 60%; margin-bottom: 12px;"></div>
    <div class="skeleton" style="width: 40%;"></div>
  </div>

  <div class="help">
    Need help? Email <a href="mailto:hello@chipsharksupply.com">hello@chipsharksupply.com</a>
  </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dgpdfponhxbnhfhmbmjb.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRncGRmcG9uaHhibmhmaG1ibWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzc5ODcsImV4cCI6MjEwNjYxMzk4N30.5R9ASFR8eig65JzfNBueXp3NvwHRVtb4wQ2dyH8qhE8';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const root = document.getElementById('root');
const lede = document.getElementById('lede');

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

const STATUS_LABELS = {
  new: 'Received',
  quoting: 'Sourcing',
  quoted: 'Quote ready',
  won: 'Order placed',
  lost: 'Closed',
};
const STATUS_ORDER = ['new', 'quoting', 'quoted', 'won'];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function fmtMoney(cents, currency) {
  if (cents == null) return null;
  const amount = cents / 100;
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || 'USD' }).format(amount);
}

function renderIdForm(initialVal = '', err = '') {
  root.innerHTML = `
    <form class="id-form" id="id-form">
      <label for="rfq-id">RFQ ID or tracking link</label>
      <input id="rfq-id" type="text" placeholder="A1B2C3D4 or full UUID" value="${esc(initialVal)}" autocomplete="off" spellcheck="false" autofocus>
      <div style="margin-top: 16px;">
        <button type="submit" class="btn">Track RFQ</button>
      </div>
      ${err ? `<div class="error">${esc(err)}</div>` : ''}
    </form>
  `;
  document.getElementById('id-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('rfq-id').value.trim();
    if (!v) return;
    // Support pasting the full tracking URL
    const match = v.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    const id = match ? match[0] : v;
    if (!UUID_RE.test(id)) {
      renderIdForm(v, 'That looks incomplete. Paste the full link from your confirmation email, or your 36-character RFQ ID.');
      return;
    }
    history.pushState({}, '', `?id=${id}`);
    load(id);
  });
}

function renderStatus(data) {
  lede.textContent = `Last updated ${fmtDateTime(new Date())}.`;

  const status = data.status || 'new';
  const idx = STATUS_ORDER.indexOf(status);
  const isLost = status === 'lost';

  const quoteAmount = fmtMoney(data.quote_amount_cents, data.quote_currency);
  const hasQuote = status === 'quoted' && quoteAmount;
  const payLink = data.stripe_payment_link;

  root.innerHTML = `
    <div class="pill-row">
      <div>
        <div class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-3);margin-bottom:4px;">RFQ ID</div>
        <div class="short-id">${esc(data.short_id)}</div>
      </div>
      <div class="status-pill ${esc(status)}">
        <span class="dot"></span>${esc(STATUS_LABELS[status] || status)}
      </div>
    </div>

    <div class="timeline" style="position:relative;">
      ${!isLost ? STATUS_ORDER.map((s, i) => {
        const cls = i < idx ? 'done' : i === idx ? 'active' : 'pending';
        return `
          <div class="step ${cls}" style="position:relative;">
            <div class="mark"></div>
            <div>
              <div class="label">${STATUS_LABELS[s]}</div>
              <div class="sub">${s === 'new' ? 'We have your request' : s === 'quoting' ? 'Checking vetted sourcing partners' : s === 'quoted' ? 'Price and lead time confirmed' : 'Shipped with documentation'}</div>
            </div>
          </div>
        `;
      }).join('') : `
        <div class="step done"><div class="mark"></div><div><div class="label">${STATUS_LABELS.lost}</div><div class="sub">This RFQ was closed. Contact us if that was unexpected.</div></div></div>
      `}
    </div>

    ${hasQuote ? `
      <div class="quote-card">
        <div class="label">Quote</div>
        <div class="amount">${esc(quoteAmount)}</div>
        <div style="color:var(--ink-2);font-size:14px;margin-bottom:16px;">For ${esc(data.qty)} × ${esc(data.mpn)}</div>
        ${payLink ? `<a href="${esc(payLink)}" class="btn" target="_blank" rel="noopener">Accept and pay →</a>` : '<p style="color:var(--ink-3);font-size:13px;margin:0;">Payment link will be shared via email shortly.</p>'}
      </div>
    ` : ''}

    <hr style="border:none;border-top:0.5px solid var(--line);margin:24px 0;">

    <div class="details">
      <div>
        <div class="k">MPN</div>
        <div class="v mono">${esc(data.mpn)}</div>
      </div>
      <div>
        <div class="k">Quantity</div>
        <div class="v">${esc(data.qty)}</div>
      </div>
      <div>
        <div class="k">Needed by</div>
        <div class="v">${fmtDate(data.needed_by)}</div>
      </div>
      <div>
        <div class="k">Urgency</div>
        <div class="v">${esc(data.urgency)}</div>
      </div>
      <div>
        <div class="k">Submitted</div>
        <div class="v">${fmtDateTime(data.created_at)}</div>
      </div>
      <div>
        <div class="k">Status</div>
        <div class="v">${esc(STATUS_LABELS[status] || status)}</div>
      </div>
    </div>
  `;
}

async function load(id) {
  root.innerHTML = `
    <div class="skeleton" style="width: 70%; margin-bottom: 12px;"></div>
    <div class="skeleton" style="width: 50%; margin-bottom: 20px;"></div>
    <div class="skeleton" style="width: 90%; margin-bottom: 10px;"></div>
    <div class="skeleton" style="width: 85%; margin-bottom: 10px;"></div>
    <div class="skeleton" style="width: 75%;"></div>
  `;
  lede.textContent = 'Loading your RFQ status…';

  const { data, error } = await sb.rpc('get_rfq_status', { rfq_id: id });
  if (error) {
    renderIdForm(id, `Couldn't load that RFQ. (${error.message})`);
    return;
  }
  if (!data || data.length === 0) {
    renderIdForm(id, `No RFQ found with that ID. Check the link in your confirmation email.`);
    return;
  }
  renderStatus(data[0]);
}

// Entry
const params = new URLSearchParams(location.search);
const idFromUrl = params.get('id');
if (idFromUrl && UUID_RE.test(idFromUrl)) {
  load(idFromUrl);
} else {
  renderIdForm(idFromUrl || '', idFromUrl ? 'That ID doesn\'t look right. Paste the full link from your confirmation email.' : '');
}
</script>
</body>
</html>
