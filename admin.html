<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChipShark — Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1f'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='600' fill='white' text-anchor='middle'%3ESD%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#ffffff; --surface:#fff; --surface-2:#f5f5f7; --ink:#1d1d1f; --ink-2:#424245; --ink-3:#86868b; --line:#d2d2d7; --accent:#0071e3; --accent-hover:#0077ed; --ok:#30861a; --warn:#8a4a0b; --danger:#c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .topbar { position: sticky; top:0; z-index: 10; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--line); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  .topbar .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
  .brand-mark { width:24px; height:24px; border-radius:6px; background: var(--ink); color:var(--bg); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
  .topbar .user { font-size: 12px; color: var(--ink-3); }
  .topbar button { background: transparent; border: 0.5px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 12px; color: var(--ink-2); cursor: pointer; margin-left: 10px; }
  .topbar button:hover { background: var(--surface-2); }
  .login { max-width: 400px; margin: 100px auto; padding: 32px; background: var(--surface); border: 0.5px solid var(--line); border-radius: 18px; }
  .login h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .login p { margin: 0 0 20px; font-size: 14px; color: var(--ink-2); }
  .login input { width: 100%; padding: 11px 13px; font-size: 15px; background: var(--bg); color: var(--ink); border: 0.5px solid var(--line); border-radius: 10px; font-family: inherit; margin-bottom: 12px; }
  .login input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .login button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; font-size: 15px; font-weight: 500; border-radius: 980px; cursor: pointer; }
  .login button:hover { opacity: 0.92; }
  .login button:disabled { opacity: 0.6; }
  .login .msg { font-size: 13px; margin-top: 12px; padding: 10px; border-radius: 8px; }
  .login .msg.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .login .msg.err { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 0.5px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-3); margin-bottom: 4px; }
  .stat .value { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 20px; border: 0.5px solid var(--line); font-size: 12px; cursor: pointer; background: var(--surface); color: var(--ink-2); }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }
  .rfq-list { display: flex; flex-direction: column; gap: 10px; }
  .rfq { background: var(--surface); border: 0.5px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .rfq-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; }
  .rfq-head .who { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
  .rfq-head .meta { font-size: 12px; color: var(--ink-3); }
  .rfq-head .time { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; margin-left: 6px; }
  .b-new { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .b-quoted { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .b-won { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .b-lost { background: color-mix(in srgb, var(--ink-3) 20%, transparent); color: var(--ink-3); }
  .b-urgent { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .rfq-body { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 20px; font-size: 13px; }
  .rfq-field .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-3); margin-bottom: 2px; }
  .rfq-field .value { color: var(--ink); word-break: break-word; }
  .rfq-field pre { margin: 0; font-family: inherit; white-space: pre-wrap; }
  .rfq-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rfq-actions select { background: var(--bg); color: var(--ink); border: 0.5px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-family: inherit; }
  .rfq-actions a { font-size: 12px; color: var(--accent); text-decoration: none; padding: 5px 10px; border: 0.5px solid var(--accent); border-radius: 8px; }
  .rfq-actions a:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-3); font-size: 14px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-3); font-size: 13px; }
</style>
</head>
<body>

<div id="login-view" class="login">
  <h1>ChipShark Admin</h1>
  <p>Enter your email. We'll send you a magic link.</p>
  <input id="email-in" type="email" placeholder="adityapareek0923@gmail.com" autocomplete="email">
  <button id="send-btn">Send magic link</button>
  <div id="login-msg" class="msg" style="display:none"></div>
</div>

<div id="app-view" style="display:none">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">CS</span>ChipShark · Admin</div>
    <div>
      <span class="user" id="user-email"></span>
      <button id="refresh-btn">Refresh</button>
      <button id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="new">New</button>
      <button class="chip" data-filter="quoted">Quoted</button>
      <button class="chip" data-filter="won">Won</button>
      <button class="chip" data-filter="lost">Lost</button>
      <button class="chip" data-filter="urgent">Urgent only</button>
    </div>
    <div id="rfq-list" class="rfq-list"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = "https://dgpdfponhxbnhfhmbmjb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRncGRmcG9uaHhibmhmaG1ibWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzc5ODcsImV4cCI6MjEwNjYxMzk4N30.5R9ASFR8eig65JzfNBueXp3NvwHRVtb4wQ2dyH8qhE8";
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginView = document.getElementById('login-view');
  const appView = document.getElementById('app-view');
  const emailIn = document.getElementById('email-in');
  const sendBtn = document.getElementById('send-btn');
  const loginMsg = document.getElementById('login-msg');

  function showMsg(text, kind) {
    loginMsg.textContent = text;
    loginMsg.className = 'msg ' + kind;
    loginMsg.style.display = 'block';
  }

  sendBtn.addEventListener('click', async () => {
    const email = emailIn.value.trim();
    if (!email) return;
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    if (error) {
      showMsg(error.message, 'err');
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send magic link';
    } else {
      showMsg('Check your email for the magic link.', 'ok');
      sendBtn.textContent = 'Sent';
    }
  });

  let currentFilter = 'all';
  let allRfqs = [];

  function renderList() {
    const list = document.getElementById('rfq-list');
    let rows = allRfqs;
    if (currentFilter === 'urgent') rows = rows.filter(r => r.urgency && r.urgency.toLowerCase().includes('urgent'));
    else if (currentFilter !== 'all') rows = rows.filter(r => (r.status || 'new') === currentFilter);
    if (!rows.length) { list.innerHTML = '<div class="empty">No RFQs match this filter.</div>'; return; }
    list.innerHTML = rows.map(r => {
      const status = r.status || 'new';
      const isUrgent = r.urgency && r.urgency.toLowerCase().includes('urgent');
      const d = new Date(r.created_at);
      const timeAgo = ((Date.now() - d) / 3600000) < 24
        ? Math.round((Date.now() - d) / 3600000) + 'h ago'
        : d.toLocaleDateString();
      return `
        <div class="rfq">
          <div class="rfq-head">
            <div>
              <p class="who">${esc(r.name)} · ${esc(r.company)}
                <span class="badge b-${status}">${status}</span>
                ${isUrgent ? '<span class="badge b-urgent">URGENT</span>' : ''}
              </p>
              <p class="meta">${esc(r.email)}${r.phone ? ' · ' + esc(r.phone) : ''}</p>
            </div>
            <div class="time">${timeAgo}</div>
          </div>
          <div class="rfq-body">
            <div class="rfq-field"><div class="label">Part number(s)</div><pre class="value">${esc(r.mpn)}</pre></div>
            <div class="rfq-field"><div class="label">Quantity</div><div class="value">${esc(r.qty)}</div></div>
            <div class="rfq-field"><div class="label">Target price</div><div class="value">${esc(r.target || '—')}</div></div>
            <div class="rfq-field"><div class="label">Needed by</div><div class="value">${esc(r.needed_by)}</div></div>
            <div class="rfq-field"><div class="label">Urgency</div><div class="value">${esc(r.urgency)}</div></div>
            ${r.notes ? `<div class="rfq-field" style="grid-column:1/-1"><div class="label">Notes</div><pre class="value">${esc(r.notes)}</pre></div>` : ''}
          </div>
          <div class="rfq-actions">
            <select data-id="${r.id}" class="status-sel">
              <option value="new"${status==='new'?' selected':''}>new</option>
              <option value="quoted"${status==='quoted'?' selected':''}>quoted</option>
              <option value="won"${status==='won'?' selected':''}>won</option>
              <option value="lost"${status==='lost'?' selected':''}>lost</option>
            </select>
            <a href="mailto:${esc(r.email)}?subject=Quote%20for%20RFQ%20%23${r.id.slice(0,8)}&body=Hi%20${encodeURIComponent(r.name.split(' ')[0])}%2C%0A%0AThanks%20for%20your%20RFQ.%20Here's%20what%20we%20found%3A%0A%0A">Email quote</a>
          </div>
        </div>
      `;
    }).join('');
    list.querySelectorAll('.status-sel').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const id = e.target.dataset.id;
        const value = e.target.value;
        const { error } = await sb.from('rfqs').update({ status: value }).eq('id', id);
        if (error) alert('Update failed: ' + error.message);
        else { const r = allRfqs.find(x => x.id === id); if (r) r.status = value; renderStats(); }
      });
    });
  }

  function renderStats() {
    const total = allRfqs.length;
    const newCount = allRfqs.filter(r => (r.status || 'new') === 'new').length;
    const quoted = allRfqs.filter(r => r.status === 'quoted').length;
    const won = allRfqs.filter(r => r.status === 'won').length;
    const urgent = allRfqs.filter(r => r.urgency && r.urgency.toLowerCase().includes('urgent') && (r.status || 'new') === 'new').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="label">Total RFQs</div><div class="value">${total}</div></div>
      <div class="stat"><div class="label">Open (new)</div><div class="value">${newCount}</div></div>
      <div class="stat"><div class="label">Urgent open</div><div class="value" style="color: ${urgent ? 'var(--danger)' : 'inherit'}">${urgent}</div></div>
      <div class="stat"><div class="label">Quoted</div><div class="value">${quoted}</div></div>
      <div class="stat"><div class="label">Won</div><div class="value">${won}</div></div>
    `;
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function loadRfqs() {
    document.getElementById('rfq-list').innerHTML = '<div class="loading">Loading RFQs…</div>';
    const { data, error } = await sb.from('rfqs').select('*').order('created_at', { ascending: false });
    if (error) { document.getElementById('rfq-list').innerHTML = '<div class="empty">Error: ' + esc(error.message) + '</div>'; return; }
    allRfqs = data || [];
    renderStats(); renderList();
  }

  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      currentFilter = c.dataset.filter;
      renderList();
    });
  });

  document.getElementById('refresh-btn').addEventListener('click', loadRfqs);
  document.getElementById('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      loginView.style.display = 'none';
      appView.style.display = 'block';
      document.getElementById('user-email').textContent = session.user.email;
      await loadRfqs();
    }
  }
  init();

  sb.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_IN') init(); });
</script>

</body>
</html>
