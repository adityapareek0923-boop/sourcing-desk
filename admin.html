<style>
  :root { --bg:#ffffff; --surface:#fff; --surface-2:#f5f5f7; --ink:#1d1d1f; --ink-2:#424245; --ink-3:#86868b; --line:#d2d2d7; --accent:#e63946; --accent-hover:#d02e3b; --ok:#30861a; --warn:#8a4a0b; --danger:#c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Inter", "-apple-system", BlinkMacSystemFont, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .topbar { position: sticky; top:0; z-index: 10; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  .topbar .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
  .brand-mark { width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; color: var(--ink); }
  .brand-mark svg { width:26px; height:26px; display:block; }
  .topbar .right { display:flex; align-items:center; gap:10px; }
  .topbar .live { display:inline-flex; align-items:center; gap:6px; font-size:11px; color: var(--ink-3); padding: 4px 10px; background: var(--surface-2); border-radius: 20px; }
  .topbar .live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .topbar button { background: transparent; border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .topbar button:hover { background: var(--surface-2); }
  .login { max-width: 400px; margin: 80px auto; padding: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .login h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .login p { margin: 0 0 20px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .login input { width: 100%; padding: 11px 13px; font-size: 15px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; font-family: inherit; margin-bottom: 12px; }
  .login input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .login button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; font-size: 15px; font-weight: 500; border-radius: 10px; cursor: pointer; font-family: inherit; }
  .login button:hover { opacity: 0.92; }
  .login button:disabled { opacity: 0.6; cursor: not-allowed; }
  .login .msg { font-size: 13px; margin-top: 12px; padding: 10px; border-radius: 8px; }
  .login .msg.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .login .msg.err { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .login .note { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 14px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat.urgent-alive { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 6%, var(--surface)); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-3); margin-bottom: 4px; }
  .stat .value { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .chip { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); font-size: 12px; cursor: pointer; background: var(--surface); color: var(--ink-2); font-family: inherit; }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }
  .filters .sep { color: var(--ink-3); font-size: 11px; margin: 0 4px; }
  .section-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-3); margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-head.priority { color: var(--danger); }
  .section-head .count { background: var(--surface-2); color: var(--ink-2); padding: 1px 7px; border-radius: 10px; font-weight: 500; letter-spacing: 0; }
  .section-head.priority .count { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .rfq-list { display: flex; flex-direction: column; gap: 10px; }
  .rfq { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease; overflow: hidden; max-height: 1200px; }
  .rfq.urgent-new { border-color: var(--danger); border-left-width: 3px; background: color-mix(in srgb, var(--danger) 2.5%, var(--surface)); }
  .rfq.just-arrived { animation: slide-in 0.5s ease-out; }
  .rfq.fading-out { opacity: 0; transform: translateX(40px) scale(0.98); max-height: 0; margin-top: -10px; padding-top: 0; padding-bottom: 0; border-width: 0; }
  @keyframes slide-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .rfq-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; }
  .rfq-head .who { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
  .rfq-head .meta { font-size: 12px; color: var(--ink-3); }
  .rfq-head .meta a { color: var(--ink-3); text-decoration: none; }
  .rfq-head .meta a:hover { color: var(--accent); text-decoration: underline; }
  .rfq-head .time { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; margin-left: 6px; }
  .b-new { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .b-quoted { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .b-won { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .b-lost, .b-unable_to_source { background: color-mix(in srgb, var(--ink-3) 20%, transparent); color: var(--ink-3); }
  .b-urgent { background: var(--danger); color: #fff; }
  .rfq-body { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 20px; font-size: 13px; }
  .rfq-field .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-3); margin-bottom: 2px; }
  .rfq-field .value { color: var(--ink); word-break: break-word; }
  .rfq-field pre { margin: 0; font-family: inherit; white-space: pre-wrap; }
  .rfq-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rfq-actions select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-family: inherit; }
  .rfq-actions a, .rfq-actions button.ghost { font-size: 12px; color: var(--accent); text-decoration: none; padding: 5px 10px; border: 1px solid var(--accent); border-radius: 8px; background: transparent; cursor: pointer; font-family: inherit; }
  .rfq-actions a:hover, .rfq-actions button.ghost:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .quote-form { margin-top: 12px; padding: 14px; background: color-mix(in srgb, var(--accent) 5%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 10px; display: grid; grid-template-columns: 180px auto auto 1fr; gap: 8px 12px; align-items: center; }
  @media (max-width: 640px) { .quote-form { grid-template-columns: 1fr; } }
  .quote-form input { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit; width: 100%; }
  .quote-form input:focus { outline: none; border-color: var(--accent); }
  .quote-form button.save { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .quote-form button.save:hover { background: var(--accent-hover); }
  .quote-form button.save:disabled { opacity: 0.5; cursor: not-allowed; }
  .quote-form button.cant { background: #fff; color: var(--danger); border: 1px solid var(--danger); border-radius: 7px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .quote-form button.cant:hover { background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .quote-form .saved { font-size: 12px; color: var(--ok); margin-left: 0; }
  .quote-form .hint { grid-column: 1 / -1; font-size: 11px; color: var(--ink-3); margin-top: -2px; }
  .quote-form .link-row { grid-column: 1 / -1; display: flex; gap: 14px; align-items: flex-start; margin-top: 6px; flex-wrap: wrap; }
  .quote-form .link-row .link-text { flex: 1 1 220px; min-width: 0; font-size: 11px; color: var(--ok); word-break: break-all; }
  .quote-form .link-row .link-text a { color: var(--ok); text-decoration: underline; }
  .quote-form .qr-mini { flex: 0 0 auto; width: 72px; height: 72px; background: #fff; padding: 4px; border: 1px solid var(--line); border-radius: 6px; }
  .quote-form .qr-mini img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .quote-form .toggle-advanced { grid-column: 1 / -1; font-size: 11px; color: var(--ink-3); cursor: pointer; background: none; border: none; padding: 0; text-align: left; text-decoration: underline; font-family: inherit; }
  .quote-form .advanced { grid-column: 1 / -1; display: none; margin-top: 4px; }
  .quote-form .advanced.show { display: block; }
  .quote-form .advanced input { width: 100%; }
  .last-email { grid-column: 1 / -1; font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-3); font-size: 14px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-3); font-size: 13px; }
  .toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
  .toast { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); font-size: 13px; max-width: 320px; animation: toast-in 0.3s ease; }
  .toast.urgent { border-color: var(--danger); border-left-width: 3px; }
  .toast.ok { border-color: var(--ok); border-left-width: 3px; }
  .toast .t-title { font-weight: 500; margin-bottom: 2px; }
  .toast .t-sub { font-size: 12px; color: var(--ink-3); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  /* ---------- Email composer modal ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .modal-head .close { background: transparent; border: none; font-size: 22px; cursor: pointer; color: var(--ink-3); padding: 0 4px; line-height: 1; }
  .modal-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
  .modal-body .to-row { font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
  .modal-body .to-row strong { color: var(--ink); font-weight: 500; }
  .modal-body label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-3); margin-bottom: 6px; margin-top: 14px; }
  .modal-body label:first-of-type { margin-top: 0; }
  .modal-body input, .modal-body textarea { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  .modal-body textarea { min-height: 240px; resize: vertical; line-height: 1.55; font-family: "Inter", "-apple-system", BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .modal-foot { padding: 14px 22px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); }
  .modal-foot .status-text { font-size: 12px; color: var(--ink-3); flex: 1; }
  .modal-foot .status-text.err { color: var(--danger); }
  .modal-foot button { padding: 9px 18px; border-radius: 10px; border: none; font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 500; }
  .modal-foot .btn-cancel { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
  .modal-foot .btn-cancel:hover { background: var(--surface-2); }
  .modal-foot .btn-send { background: var(--accent); color: #fff; }
  .modal-foot .btn-send:hover { background: var(--accent-hover); }
  .modal-foot .btn-send.danger { background: var(--danger); }
  .modal-foot .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="login-view" class="login" style="display:none">
  <h1 id="login-title">ChipShark Admin</h1>
  <p id="login-help">Enter your password to log in.</p>
  <input id="pwd-in" type="password" placeholder="Password" autocomplete="current-password">
  <input id="pwd-in-2" type="password" placeholder="Confirm password" autocomplete="new-password" style="display:none">
  <input id="setup-token" type="text" placeholder="Setup token (from Supabase reset)" autocomplete="off" style="display:none">
  <button id="submit-btn">Log in</button>
  <div id="login-msg" class="msg" style="display:none"></div>
  <p class="note">Sessions last 12 hours. Lose the password and you'll need to reset via Supabase.</p>
</div>

<div id="app-view" style="display:none">
  <div class="topbar">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="0" y="9" width="4" height="2.5" rx="0.5"/><rect x="0" y="15" width="4" height="2.5" rx="0.5"/><rect x="0" y="21" width="4" height="2.5" rx="0.5"/><rect x="28" y="9" width="4" height="2.5" rx="0.5"/><rect x="28" y="15" width="4" height="2.5" rx="0.5"/><rect x="28" y="21" width="4" height="2.5" rx="0.5"/><rect x="4" y="5" width="24" height="22" rx="4"/><circle cx="9" cy="10" r="2" fill="#fff"/></svg></span>ChipShark · Admin</div>
    <div class="right">
      <span class="live" id="live-indicator" title="Auto-refresh every 10 seconds"><span class="dot"></span><span id="live-text">Live</span></span>
      <button id="refresh-btn">Refresh</button>
      <button id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <button class="chip" data-filter="all">All</button>
      <button class="chip active" data-filter="new">New</button>
      <button class="chip" data-filter="quoted">Quoted</button>
      <button class="chip" data-filter="won">Won</button>
      <button class="chip" data-filter="lost">Lost</button>
      <button class="chip" data-filter="unable_to_source">Unable</button>
      <span class="sep">·</span>
      <button class="chip" data-filter="urgent">Urgent only</button>
    </div>
    <div id="rfq-list" class="rfq-list"></div>
  </div>
</div>

<!-- Email composer modal -->
<div class="modal-backdrop" id="compose-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="compose-title">Review email</h2>
      <button class="close" id="compose-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="to-row">To: <strong id="compose-to"></strong></div>
      <label>Subject</label>
      <input id="compose-subject" type="text">
      <label>Message</label>
      <textarea id="compose-body" spellcheck="true"></textarea>
    </div>
    <div class="modal-foot">
      <span class="status-text" id="compose-status"></span>
      <button class="btn-cancel" id="compose-cancel">Cancel</button>
      <button class="btn-send" id="compose-send">Send</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script>
  const API = "https://dgpdfponhxbnhfhmbmjb.supabase.co/functions/v1/admin-api";
  const TOKEN_KEY = "chipshark_admin_token_v1";
  const OLD_PWD_KEY = "chipshark_admin_pwd_v1"; // legacy: plaintext password, purged on load
  const POLL_MS = 10000;

  const $ = (id) => document.getElementById(id);
  const loginView = $('login-view');
  const appView = $('app-view');
  const pwdIn = $('pwd-in');
  const pwdIn2 = $('pwd-in-2');
  const setupTokenIn = $('setup-token');
  const submitBtn = $('submit-btn');
  const loginMsg = $('login-msg');
  const loginHelp = $('login-help');

  let mode = 'login';
  let token = null;      // session token from /verify (12h)
  let legacyPwd = null;  // only used if the API predates tokens
  let currentFilter = 'new'; // default to actionable queue
  let allRfqs = [];
  let knownIds = new Set();
  let justArrivedIds = new Set();
  let pollTimer = null;
  let composeCtx = null; // {rfqId, type}

  function showMsg(text, kind) {
    loginMsg.textContent = text;
    loginMsg.className = 'msg ' + kind;
    loginMsg.style.display = 'block';
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function api(path, opts = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (token) headers['x-admin-token'] = token;
    else if (legacyPwd) headers['x-admin-pwd'] = legacyPwd;
    const r = await fetch(API + path, Object.assign({}, opts, { headers }));
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && token) { logout(); throw new Error('Session expired. Log in again.'); }
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  async function checkMode() {
    try {
      const data = await (await fetch(API + '/status')).json();
      if (data.setup_required) {
        mode = 'setup';
        $('login-title').textContent = 'First-time setup';
        loginHelp.textContent = 'Pick a password. 8+ characters. Store it somewhere safe — there is no email reset.';
        pwdIn.placeholder = 'New password';
        pwdIn.autocomplete = 'new-password';
        pwdIn2.style.display = 'block';
        setupTokenIn.style.display = 'block';
        submitBtn.textContent = 'Create password';
      } else {
        mode = 'login';
      }
      loginView.style.display = 'block';
    } catch (e) {
      loginView.style.display = 'block';
      showMsg('Could not reach admin API: ' + e.message, 'err');
    }
  }

  submitBtn.addEventListener('click', async () => {
    const p = pwdIn.value;
    if (!p) return;
    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'setup' ? 'Creating…' : 'Checking…';
    try {
      if (mode === 'setup') {
        if (p.length < 8) { showMsg('Password must be at least 8 characters.', 'err'); submitBtn.disabled = false; submitBtn.textContent = 'Create password'; return; }
        if (p !== pwdIn2.value) { showMsg('Passwords do not match.', 'err'); submitBtn.disabled = false; submitBtn.textContent = 'Create password'; return; }
        await (await fetch(API + '/setup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: p, setup_token: setupTokenIn.value.trim() }) })).json().then(d => { if (d.error) throw new Error(d.error); });
      }
      const r = await (await fetch(API + '/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: p }) })).json();
      if (!r.ok) { showMsg(r.error || 'Wrong password.', 'err'); submitBtn.disabled = false; submitBtn.textContent = mode === 'setup' ? 'Create password' : 'Log in'; return; }
      token = r.token || null; legacyPwd = r.token ? null : p;
      if (token) localStorage.setItem(TOKEN_KEY, token);
      pwdIn.value = ''; pwdIn2.value = ''; setupTokenIn.value = '';
      loginView.style.display = 'none';
      appView.style.display = 'block';
      await loadRfqs(true);
      startPolling();
    } catch (e) {
      showMsg(e.message, 'err');
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'setup' ? 'Create password' : 'Log in';
    }
  });

  pwdIn.addEventListener('keydown', e => { if (e.key === 'Enter' && mode === 'login') submitBtn.click(); });
  pwdIn2.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });

  function isUrgentNew(r) {
    const status = r.status || 'new';
    const urg = (r.urgency || '').toLowerCase();
    return status === 'new' && (urg.includes('urgent') || urg.includes('line down') || urg.includes('critical'));
  }

  function priorityBucket(r) {
    if (isUrgentNew(r)) return 0;
    if ((r.status || 'new') === 'new') return 1;
    return 2;
  }

  function sortRows(rows) {
    return [...rows].sort((a, b) => {
      const pa = priorityBucket(a), pb = priorityBucket(b);
      if (pa !== pb) return pa - pb;
      return new Date(b.created_at) - new Date(a.created_at);
    });
  }

  // Make a small QR as a data: URL from the qrcode-generator CDN lib
  function qrDataUrl(text, size = 64) {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      return qr.createDataURL(3, 2); // cellSize=3, margin=2
    } catch (e) { console.warn('QR gen failed', e); return ''; }
  }

  function rowHtml(r) {
    const status = r.status || 'new';
    const urgent = isUrgentNew(r);
    const d = new Date(r.created_at);
    const hoursAgo = (Date.now() - d) / 3600000;
    const timeAgo = hoursAgo < 1
      ? Math.max(1, Math.round(hoursAgo * 60)) + 'm ago'
      : hoursAgo < 24
        ? Math.round(hoursAgo) + 'h ago'
        : d.toLocaleDateString();
    const justArrived = justArrivedIds.has(r.id);
    const classes = ['rfq'];
    if (urgent) classes.push('urgent-new');
    if (justArrived) classes.push('just-arrived');
    const phoneLink = r.phone ? ` · <a href="tel:${esc(r.phone.replace(/[^0-9+]/g,''))}">${esc(r.phone)}</a>` : '';
    const qrImg = r.stripe_payment_link ? `<div class="qr-mini" title="Scan to open Stripe link"><img src="${qrDataUrl(r.stripe_payment_link)}" alt="Stripe QR"></div>` : '';
    const lastEmailLine = r.last_email_sent_at ? `<div class="last-email">📧 Last email: ${esc(r.last_email_type || 'sent')} · ${new Date(r.last_email_sent_at).toLocaleString()}</div>` : '';
    return `
      <div class="${classes.join(' ')}" data-rfq-id="${r.id}">
        <div class="rfq-head">
          <div>
            <p class="who">${esc(r.name)} · ${esc(r.company)}
              <span class="badge b-${status}">${status.replace(/_/g, ' ')}</span>
              ${urgent ? '<span class="badge b-urgent">URGENT</span>' : ''}
            </p>
            <p class="meta"><a href="mailto:${esc(r.email)}">${esc(r.email)}</a>${phoneLink}</p>
          </div>
          <div class="time">${timeAgo}</div>
        </div>
        <div class="rfq-body">
          <div class="rfq-field"><div class="label">Part number(s)</div><pre class="value">${esc(r.mpn)}</pre></div>
          <div class="rfq-field"><div class="label">Quantity</div><div class="value">${esc(r.qty)}</div></div>
          <div class="rfq-field"><div class="label">Target price</div><div class="value">${esc(r.target || '—')}</div></div>
          <div class="rfq-field"><div class="label">Needed by</div><div class="value">${esc(r.needed_by)}</div></div>
          <div class="rfq-field"><div class="label">Urgency</div><div class="value">${esc(r.urgency)}</div></div>
          ${r.notes ? `<div class="rfq-field" style="grid-column:1/-1"><div class="label">Notes</div><pre class="value">${esc(r.notes)}</pre></div>` : ''}
        </div>
        <div class="rfq-actions">
          <select data-id="${r.id}" class="status-sel">
            <option value="new"${status==='new'?' selected':''}>new</option>
            <option value="quoted"${status==='quoted'?' selected':''}>quoted</option>
            <option value="won"${status==='won'?' selected':''}>won</option>
            <option value="lost"${status==='lost'?' selected':''}>lost</option>
            <option value="unable_to_source"${status==='unable_to_source'?' selected':''}>unable to source</option>
          </select>
          <a href="/track.html?id=${r.id}" target="_blank">View buyer page</a>
        </div>
        <div class="quote-form" data-id="${r.id}">
          <input class="qamt" placeholder="Quote total USD (e.g. 1250.00)" value="${r.quote_amount_cents != null ? (r.quote_amount_cents/100).toFixed(2) : ''}" inputmode="decimal">
          <button class="save" data-id="${r.id}">${r.stripe_payment_link ? 'Update quote &amp; email' : 'Save quote &amp; email'}</button>
          <button class="cant" data-id="${r.id}" title="Email buyer that we can't source this">Can't source →</button>
          <span class="saved" data-id="${r.id}"></span>
          <div class="hint">💡 Save creates the Stripe payment link, then opens an email you can edit before it sends.</div>
          ${r.stripe_payment_link ? `<div class="link-row"><div class="link-text">Buyer link:<br><a href="${esc(r.stripe_payment_link)}" target="_blank" rel="noopener">${esc(r.stripe_payment_link)}</a></div>${qrImg}</div>` : ''}
          ${lastEmailLine}
          <button type="button" class="toggle-advanced" data-id="${r.id}">Advanced: paste your own Stripe link instead ▸</button>
          <div class="advanced" data-id="${r.id}">
            <input class="qlink" placeholder="https://buy.stripe.com/..." value="${esc(r.stripe_payment_link || '')}">
          </div>
        </div>
      </div>
    `;
  }

  function renderList() {
    const list = $('rfq-list');
    let rows = sortRows(allRfqs);
    if (currentFilter === 'urgent') rows = rows.filter(r => (r.urgency || '').toLowerCase().match(/urgent|line down|critical/));
    else if (currentFilter !== 'all') rows = rows.filter(r => (r.status || 'new') === currentFilter);

    if (!rows.length) { list.innerHTML = '<div class="empty">No RFQs match this filter.</div>'; return; }

    const urgentRows = rows.filter(isUrgentNew);
    const otherRows = rows.filter(r => !isUrgentNew(r));

    let html = '';
    if (urgentRows.length && (currentFilter === 'all' || currentFilter === 'new')) {
      html += `<div class="section-head priority">⚡ Priority queue <span class="count">${urgentRows.length}</span></div>`;
      html += urgentRows.map(rowHtml).join('');
      if (otherRows.length) {
        html += `<div class="section-head">${currentFilter === 'new' ? 'Other new RFQs' : 'All other RFQs'} <span class="count">${otherRows.length}</span></div>`;
        html += otherRows.map(rowHtml).join('');
      }
    } else {
      html += rows.map(rowHtml).join('');
    }
    list.innerHTML = html;
    justArrivedIds.clear();
    wireRowHandlers();
  }

  // Fade a row out in-place without a full re-render — gives instant visual feedback
  function fadeOutRow(id, onDone) {
    const el = document.querySelector(`.rfq[data-rfq-id="${id}"]`);
    if (!el) { if (onDone) onDone(); return; }
    el.classList.add('fading-out');
    setTimeout(() => { if (onDone) onDone(); }, 380);
  }

  // Does this RFQ still belong on the current filter? If not, it should fade away.
  function matchesCurrentFilter(r) {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'urgent') return (r.urgency || '').toLowerCase().match(/urgent|line down|critical/) && (r.status || 'new') === 'new';
    return (r.status || 'new') === currentFilter;
  }

  function wireRowHandlers() {
    document.querySelectorAll('.status-sel').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const id = e.target.dataset.id;
        const value = e.target.value;
        try {
          await api('/update?id=' + id, { method: 'PATCH', body: JSON.stringify({ status: value }) });
          const r = allRfqs.find(x => x.id === id); if (r) r.status = value;
          renderStats();
          if (r && !matchesCurrentFilter(r)) fadeOutRow(id, renderList);
          else renderList();
        } catch (err) { alert('Update failed: ' + err.message); }
      });
    });
    document.querySelectorAll('.quote-form .toggle-advanced').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const form = e.target.closest('.quote-form');
        const adv = form.querySelector('.advanced');
        adv.classList.toggle('show');
        btn.textContent = adv.classList.contains('show')
          ? 'Advanced: paste your own Stripe link instead ▾'
          : 'Advanced: paste your own Stripe link instead ▸';
      });
    });
    document.querySelectorAll('.quote-form .save').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        const form = e.target.closest('.quote-form');
        const amtStr = form.querySelector('.qamt').value.trim().replace(/[$,\s]/g, '');
        const advShown = form.querySelector('.advanced')?.classList.contains('show');
        const link = advShown ? form.querySelector('.qlink').value.trim() : '';
        const saved = form.querySelector('.saved');
        if (!amtStr) { saved.textContent = 'Enter a quote amount.'; saved.style.color = 'var(--danger)'; return; }
        const amtNum = parseFloat(amtStr);
        if (isNaN(amtNum) || amtNum < 0.5) { saved.textContent = 'Minimum $0.50.'; saved.style.color = 'var(--danger)'; return; }
        if (link && !/^https?:\/\//.test(link)) { saved.textContent = 'Link must start with https://'; saved.style.color = 'var(--danger)'; return; }
        btn.disabled = true; saved.textContent = link ? 'Saving…' : 'Creating Stripe link…'; saved.style.color = 'var(--ink-3)';
        const patch = {
          quote_amount_cents: Math.round(amtNum * 100),
          quote_currency: 'USD',
          status: 'quoted',
        };
        if (link) patch.stripe_payment_link = link;
        try {
          const result = await api('/update?id=' + id, { method: 'PATCH', body: JSON.stringify(patch) });
          const r = allRfqs.find(x => x.id === id);
          if (r && result.rfq) Object.assign(r, result.rfq);
          saved.textContent = result.generated_link ? '✓ Saved · opening email…' : '✓ Saved · opening email…';
          saved.style.color = 'var(--ok)';
          renderStats();
          // Open the composer so admin can review/edit the quote-ready email, then fade on send
          await openComposer(id, 'quote_ready');
        } catch (err) {
          saved.textContent = 'Save failed: ' + err.message; saved.style.color = 'var(--danger)';
        } finally { btn.disabled = false; }
      });
    });
    document.querySelectorAll('.quote-form .cant').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        await openComposer(id, 'cannot_source');
      });
    });
  }

  // ---------- Email composer modal ----------
  async function openComposer(rfqId, type) {
    composeCtx = { rfqId, type };
    $('compose-title').textContent = type === 'cannot_source' ? "Email buyer: can't source" : 'Email buyer: quote ready';
    const sendBtn = $('compose-send');
    sendBtn.textContent = type === 'cannot_source' ? "Send & mark unable" : 'Send to buyer';
    sendBtn.classList.toggle('danger', type === 'cannot_source');
    $('compose-status').textContent = 'Drafting…';
    $('compose-status').classList.remove('err');
    $('compose-subject').value = '';
    $('compose-body').value = '';
    $('compose-to').textContent = '';
    $('compose-backdrop').classList.add('show');
    try {
      const draft = await api('/draft-email', { method: 'POST', body: JSON.stringify({ rfq_id: rfqId, type }) });
      $('compose-to').textContent = draft.to || '';
      $('compose-subject').value = draft.subject || '';
      $('compose-body').value = draft.body || '';
      $('compose-status').textContent = 'Review and edit before sending.';
    } catch (err) {
      $('compose-status').textContent = 'Could not draft: ' + err.message;
      $('compose-status').classList.add('err');
    }
  }

  function closeComposer() {
    $('compose-backdrop').classList.remove('show');
    composeCtx = null;
  }

  $('compose-close').addEventListener('click', closeComposer);
  $('compose-cancel').addEventListener('click', closeComposer);
  $('compose-backdrop').addEventListener('click', (e) => { if (e.target.id === 'compose-backdrop') closeComposer(); });

  $('compose-send').addEventListener('click', async () => {
    if (!composeCtx) return;
    const { rfqId, type } = composeCtx;
    const subject = $('compose-subject').value.trim();
    const body = $('compose-body').value.trim();
    if (!subject || !body) { $('compose-status').textContent = 'Subject and body required.'; $('compose-status').classList.add('err'); return; }
    const btn = $('compose-send');
    btn.disabled = true;
    $('compose-status').textContent = 'Sending…';
    $('compose-status').classList.remove('err');
    try {
      await api('/send-email', { method: 'POST', body: JSON.stringify({ rfq_id: rfqId, type, subject, body }) });
      // Update local state
      const r = allRfqs.find(x => x.id === rfqId);
      if (r) {
        r.last_email_type = type;
        r.last_email_sent_at = new Date().toISOString();
        r.last_email_subject = subject;
        if (type === 'cannot_source') r.status = 'unable_to_source';
      }
      showToast('Email sent', (type === 'cannot_source' ? 'Marked unable to source' : 'Quote delivered to buyer'), false, true);
      closeComposer();
      renderStats();
      if (r && !matchesCurrentFilter(r)) fadeOutRow(rfqId, renderList);
      else renderList();
    } catch (err) {
      $('compose-status').textContent = 'Send failed: ' + err.message;
      $('compose-status').classList.add('err');
    } finally {
      btn.disabled = false;
    }
  });

  function renderStats() {
    const total = allRfqs.length;
    const newCount = allRfqs.filter(r => (r.status || 'new') === 'new').length;
    const quoted = allRfqs.filter(r => r.status === 'quoted').length;
    const won = allRfqs.filter(r => r.status === 'won').length;
    const urgent = allRfqs.filter(isUrgentNew).length;
    $('stats').innerHTML = `
      <div class="stat ${urgent ? 'urgent-alive' : ''}"><div class="label">⚡ Urgent open</div><div class="value" style="color: ${urgent ? 'var(--danger)' : 'inherit'}">${urgent}</div></div>
      <div class="stat"><div class="label">Open (new)</div><div class="value">${newCount}</div></div>
      <div class="stat"><div class="label">Quoted</div><div class="value">${quoted}</div></div>
      <div class="stat"><div class="label">Won</div><div class="value">${won}</div></div>
      <div class="stat"><div class="label">Total RFQs</div><div class="value">${total}</div></div>
    `;
  }

  async function loadRfqs(initial) {
    if (initial) $('rfq-list').innerHTML = '<div class="loading">Loading RFQs…</div>';
    try {
      const data = await api('/list');
      const incoming = data.rfqs || [];
      if (!initial) {
        for (const r of incoming) {
          if (!knownIds.has(r.id)) {
            justArrivedIds.add(r.id);
            const urg = isUrgentNew(r);
            showToast(`${r.name} · ${r.company}`, `${(r.mpn || '').split(/\s+/)[0]} · qty ${r.qty}`, urg);
            if (urg) playPing();
          }
        }
      }
      allRfqs = incoming;
      knownIds = new Set(incoming.map(r => r.id));
      renderStats(); renderList();
      setLive('Live', 'var(--ok)');
    } catch (err) {
      if (err.message === 'unauthorized') { logout(); return; }
      setLive('Offline', 'var(--ink-3)');
      console.error('loadRfqs error', err);
    }
  }

  function setLive(text, color) {
    $('live-text').textContent = text;
    document.querySelector('#live-indicator .dot').style.background = color;
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(() => loadRfqs(false), POLL_MS);
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function showToast(title, sub, urgent, ok) {
    const stack = $('toasts');
    const el = document.createElement('div');
    el.className = 'toast' + (urgent ? ' urgent' : '') + (ok ? ' ok' : '');
    el.innerHTML = `<div class="t-title">${urgent ? '⚡ ' : ''}${esc(title)}</div><div class="t-sub">${esc(sub)}</div>`;
    stack.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.4s'; setTimeout(() => el.remove(), 400); }, urgent ? 10000 : 5000);
  }

  function playPing() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.setValueAtTime(1320, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.4);
    } catch (e) { /* no audio ok */ }
  }

  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      currentFilter = c.dataset.filter;
      renderList();
    });
  });

  $('refresh-btn').addEventListener('click', () => loadRfqs(false));

  function logout() {
    stopPolling();
    localStorage.removeItem(TOKEN_KEY);
    token = null; legacyPwd = null;
    appView.style.display = 'none';
    pwdIn.value = ''; pwdIn2.value = '';
    submitBtn.disabled = false;
    submitBtn.textContent = mode === 'setup' ? 'Create password' : 'Log in';
    loginView.style.display = 'block';
  }
  $('logout-btn').addEventListener('click', logout);

  async function init() {
    try { localStorage.removeItem(OLD_PWD_KEY); } catch { /* ignore */ }
    const stored = localStorage.getItem(TOKEN_KEY);
    if (stored) {
      token = stored;
      try {
        await api('/session');
        appView.style.display = 'block';
        await loadRfqs(true);
        startPolling();
        return;
      } catch { /* expired or invalid: fall through to login */ }
      token = null;
      localStorage.removeItem(TOKEN_KEY);
    }
    await checkMode();
  }
  init();
</script>
